[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tixi-voice"
version = "1.0.0"
description = "Tixi Voice - offline-first AI voice productivity for Windows (TTS, STT, Persian diacritization, system-wide voice typing)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "TiXi-Ai" }]
keywords = ["tts", "stt", "speech", "persian", "farsi", "voice-typing", "offline", "whisper", "piper"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# ---------------------------------------------------------------------------
# Core runtime dependencies (the "lite" footprint, < 110 MB packaged).
# Heavy AI runtimes are intentionally NOT here: they are installed on demand as
# signed-checksum "engine packs" from PyPI (see src/tixi/models/engine_packs.py)
# so the installer stays small and the user only pays for what they use.
# ---------------------------------------------------------------------------
dependencies = [
    "PySide6-Essentials>=6.6,<7",
    "numpy>=1.26,<3",
    "sounddevice>=0.4.6,<0.6",
    "soundfile>=0.12.1,<0.15",
    "requests>=2.31,<3",
    "lameenc>=1.7,<2",
]

[project.optional-dependencies]
# Persian/English neural text-to-speech (Piper). GPL-3.0-or-later engine pack.
tts = ["piper-tts>=1.3,<2"]

# Offline speech recognition (faster-whisper + CTranslate2, MIT/Apache-2.0).
stt = ["faster-whisper>=1.0,<2", "ctranslate2>=4,<5"]

# Neural Persian diacritization + ONNX runtime (used by Piper too).
diacritization = ["onnxruntime>=1.17,<2", "tokenizers>=0.15,<1"]

# Global hotkeys (Windows: pynput uses the Win32 API directly).
hotkeys = ["pynput>=1.7.6,<2"]

dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "pyinstaller>=6.6",
    "ruff>=0.5",
    "mypy>=1.10",
]

all = [
    "piper-tts>=1.3,<2",
    "faster-whisper>=1.0,<2",
    "ctranslate2>=4,<5",
    "onnxruntime>=1.17,<2",
    "tokenizers>=0.15,<1",
    "pynput>=1.7.6,<2",
]

[project.scripts]
tixi-voice = "tixi.app.application:main"

[project.urls]
Homepage = "https://github.com/TiXi-Ai/Tixi-Voice"
Releases = "https://github.com/TiXi-Ai/Tixi-Voice/releases"
Issues = "https://github.com/TiXi-Ai/Tixi-Voice/issues"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tixi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gui: tests that need a Qt application instance (run with QT_QPA_PLATFORM=offscreen)",
    "network: tests that touch the network and are skipped unless TIXI_TEST_NETWORK=1",
    "windows: tests that only make sense on Windows",
    "slow: long-running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/tixi"]
